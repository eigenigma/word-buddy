name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Download dictionary sources
        run: |
          mkdir -p data/raw
          curl -fL -o data/raw/ecdict.csv https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv
          curl -fL -o data/raw/lemma.en.txt https://raw.githubusercontent.com/skywind3000/lemma.en/master/lemma.en.txt

      - name: Build dictionary artifacts
        run: bun run build:dict

      - name: Test
        run: bun run test

      - name: Build Firefox extension
        run: bun run build:firefox
