workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

variables:
  FORCE_COLOR: "1"
  MISE_DATA_DIR: "$CI_PROJECT_DIR/.mise"
  # mise.toml carries settings, which mise refuses to load from an untrusted
  # file.
  MISE_TRUSTED_CONFIG_PATHS: "$CI_PROJECT_DIR"

stages:
  - quality
  - test
  - build

default:
  image: jdxcode/mise:2026.9.13-debian
  interruptible: true
  # Separate keys, so a lockfile change doesn't re-download the toolchain and
  # a package.json edit doesn't reinstall node_modules.
  cache:
    - &toolchain-cache
      key:
        prefix: toolchain
        files:
          - package.json
          - mise.toml
      paths:
        - .mise/installs/
      policy: pull
    - &node-modules-cache
      key:
        prefix: node-modules
        files:
          - bun.lock
      paths:
        - node_modules/
      policy: pull
  before_script:
    # Installs the bun and node versions pinned in package.json and
    # regenerates the shims, which are not cached.
    - mise install
    - export PATH="$MISE_DATA_DIR/shims:$PATH"
    - node --version
    - bun --version
    - bun install --frozen-lockfile

typecheck:
  stage: quality
  # bun install touches node_modules/.bin on every run, so each pull-push job
  # would re-upload the whole cache; this job is the only writer.
  cache:
    - <<: *toolchain-cache
      policy: pull-push
    - <<: *node-modules-cache
      policy: pull-push
  script:
    - bun run typecheck

lint:
  stage: quality
  script:
    - bun run lint

# In the quality stage so it runs alongside typecheck and lint instead of
# adding a serial stage.
dictionary:
  stage: quality
  script:
    - bun run fetch:dict
    - bun run build:dict
  artifacts:
    paths:
      - public/data/
    expire_in: 1 day

test:
  stage: test
  # queryService.test.ts loads the generated dictionary from public/data/.
  dependencies:
    - dictionary
  script:
    - bun run test

build-firefox:
  stage: build
  dependencies:
    - dictionary
  script:
    - bun run build:firefox
